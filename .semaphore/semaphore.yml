version: v1.0
name: Run tmate for 6 hours
agent:
  machine:
    os_image: ubuntu2004
    type: e1-standard-2
blocks:
  - name: testing
    task:
      jobs:
        - name: testing
          commands:
            - checkout
            - printenv | sort
            - sudo apt-get update
            - sudo apt-get install -y wget xz-utils
            - 'wget https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-static-linux-amd64.tar.xz'
            - tar -xf tmate-2.4.0-static-linux-amd64.tar.xz
            - chmod +x tmate-2.4.0-static-linux-amd64/tmate
            - mv tmate-2.4.0-static-linux-amd64/tmate .
            - |
              # Use SEMAPHORE_JOB_NUMBER for unique session names (1,2,...,10)
              echo "SEMAPHORE_JOB_NUMBER is: ${SEMAPHORE_JOB_NUMBER:-unset}"
              session_name="${SEMAPHORE_JOB_NUMBER:-1}"
              echo "Using tmate session name: $session_name"
              end=$((SECONDS+21600))
              while [ $SECONDS -lt $end ]; do
                echo "Starting tmate at $(date) with session name $session_name"
                ./tmate -F -n "$session_name" -k tmk-mS87E0h6YTY55X6FpuAAbWFMpg || true
                echo "tmate exited at $(date), restarting in 5 seconds"
                sleep 5
              done
          parallelism: 10
