version: v1.0
name: Run Remote.it Docker Agent on 5 Parallel Runners
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Start Remote.it Docker Agent
    task:
      jobs:
        - name: Start Agent Instance
          parallelism: 5
          commands:
            - echo "Pulling latest remoteit/docker-extension image..."
            - 'docker pull remoteit/docker-extension:latest'
            - echo "Starting remoteit_docker_jumpbox container..."
            - 'docker run -d \ -e R3_REGISTRATION_CODE="7CD95576-8DB7-5B3F-B40E-DF1857B2DD13" \ -v /var/run/docker.sock:/var/run/docker.sock \ --restart unless-stopped \ --name remoteit_docker_jumpbox_${SEMAPHORE_JOB_INDEX} \ remoteit/docker-extension:latest'
            - echo "Container started. Keeping job alive for 6 hours (21600 seconds)..."
            - sleep 21600
            - echo "6 hours elapsed. Stopping and removing container..."
            - 'docker stop remoteit_docker_jumpbox_${SEMAPHORE_JOB_INDEX} || true'
            - 'docker rm remoteit_docker_jumpbox_${SEMAPHORE_JOB_INDEX} || true'
