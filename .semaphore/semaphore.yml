version: v1.0
name: Run tmate for 6 hours
agent:
  machine:
    os_image: ubuntu2004
    type: e1-standard-2
blocks:
  - name: Download and Run tmate for 6 hours
    task:
      jobs:
        - name: Download and Run tmate
          commands:
            - checkout
            - sudo apt-get update
            - sudo apt-get install -y wget xz-utils
            - 'wget https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-static-linux-amd64.tar.xz'
            - tar -xf tmate-2.4.0-static-linux-amd64.tar.xz
            - chmod +x tmate-2.4.0-static-linux-amd64/tmate
            - mv tmate-2.4.0-static-linux-amd64/tmate .
            - |
              end=$((SECONDS+21600))
              while [ $SECONDS -lt $end ]; do
                echo "Starting tmate at $(date)"
                ./tmate -F  || true
                echo "tmate exited at $(date), restarting in 5 seconds"
                sleep 5
              done
          parallelism: 10
